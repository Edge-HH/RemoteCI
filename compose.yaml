services:
  remoteci:
    build:
      context: .
      dockerfile: server/RemoteCI.Server/Dockerfile
      args:
        # 本地容器构建默认跟随仓库当前版本（见 RemoteCI.Server.csproj 的 <Version>）；
        # 发布时由 release.yml 注入真实 tag 版本。容器自报版本过低会压低手表更新上限。
        REMOTECI_VERSION: ${REMOTECI_VERSION:-3.2.1.4}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      REMOTECI_ADMIN_PASSWORD: ${REMOTECI_ADMIN_PASSWORD:-}
      REMOTECI_PLUGIN_PAIR_CODE: ${REMOTECI_PLUGIN_PAIR_CODE:-}
    volumes:
      - remoteci-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  remoteci-data:
    name: remoteci-data
