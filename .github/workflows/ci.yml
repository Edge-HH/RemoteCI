name: CI

# main 分支保护依赖的常规检查：服务端/共享库构建测试 + 手表端构建测试。
# 作业 name 是分支保护的必需检查名，不要改动；步骤名统一使用“emoji + 中文”。

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# 同一 PR 的新推送取消旧运行；main 上的每次推送都完整跑完。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7
      - name: 🧰 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: 🔨 构建
        run: dotnet build RemoteCI.slnx -c Release
      - name: 🧪 测试
        run: dotnet test RemoteCI.slnx -c Release --no-build
      - name: 🧰 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 🎙️ 验证浏览器语音采集
        run: node --test server/tests/voice-message.test.mjs
      - name: 🏷️ 验证发布标签解析
        shell: bash
        run: |
          stable_output="$(bash .github/scripts/resolve-release-version.sh 3.2.1.4)"
          beta_output="$(bash .github/scripts/resolve-release-version.sh v3.2.2-beta.1)"
          grep -Fxq 'version=3.2.1.4' <<<"$stable_output"
          grep -Fxq 'channel=stable' <<<"$stable_output"
          grep -Fxq 'prerelease=false' <<<"$stable_output"
          grep -Fxq 'version=3.2.2-beta.1' <<<"$beta_output"
          grep -Fxq 'channel=beta' <<<"$beta_output"
          grep -Fxq 'prerelease=true' <<<"$beta_output"
          (
            GITHUB_REF_NAME=3.2.1.1
            source .github/scripts/resolve-release-version.sh "$GITHUB_REF_NAME" >/dev/null
            test "$version" = '3.2.1.1'
            test "$channel" = 'stable'
            test "$prerelease" = 'false'
          )
          if bash .github/scripts/resolve-release-version.sh v3.2.1; then
            echo '旧三段稳定标签不应通过解析' >&2
            exit 1
          fi
          previous_tag="$(
            printf '%s\n' 3.2.1.4 3.2.1.3 3.2.1.2 \
              | bash .github/scripts/select-previous-release-tag.sh 3.2.1.4
          )"
          test "$previous_tag" = '3.2.1.3'
      - name: 📦 验证 ClassIsland 市场包
        run: |
          # 版本号取自插件 manifest，不在这里写死，否则每次升版本 CI 都会失败。
          market_version="$(sed -n 's/^version: *//p' plugin/RemoteCI.Plugin/manifest.yml | tr -d '\r')"
          test -n "$market_version" || { echo "::error::无法从 manifest.yml 读取插件版本"; exit 1; }
          cmp -s remoteci.plugin.yml plugin/RemoteCI.Plugin/manifest.yml || {
            echo "::error::根目录 remoteci.plugin.yml 必须与 plugin/RemoteCI.Plugin/manifest.yml 完全一致"
            diff remoteci.plugin.yml plugin/RemoteCI.Plugin/manifest.yml || true
            exit 1
          }
          dotnet build plugin/RemoteCI.Plugin/RemoteCI.Plugin.csproj -c Release -t:Rebuild \
            -p:Version="$market_version" -p:CreateCipx=true
          pwsh -NoProfile -File plugin/RemoteCI.Plugin/scripts/Test-ClassIslandMarketPackage.ps1 \
            -PackagePath plugin/RemoteCI.Plugin/cipx/RemoteCI.Plugin.cipx \
            -ChecksumPath plugin/RemoteCI.Plugin/cipx/checksums.md \
            -ExpectedVersion "$market_version"

  wearos:
    name: wearos
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7
      - name: ☕ 安装 JDK 并启用 Gradle 缓存
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: ⌚ 构建并测试手表端
        working-directory: wearos
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain


  android:
    name: android-mobile
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7
      - name: ☕ 安装 JDK 并启用 Gradle 缓存
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: 📱 构建并测试手机端
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain

  container:
    # 构建服务端镜像并验证入口脚本：WebUI 自更新装到数据卷的版本会在容器重启后被真正启用。
    name: container
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7
      - name: 🐳 构建镜像并验证自更新入口
        run: |
          set -euo pipefail
          docker build -f server/RemoteCI.Server/Dockerfile --build-arg REMOTECI_VERSION=3.0.0.0 -t remoteci-ci .
          docker volume create remoteci-ci-data
          start() {
            docker run -d --name remoteci-ci -v remoteci-ci-data:/app/data -p 127.0.0.1:18080:8080 \
              -e REMOTECI_ADMIN_PASSWORD=CiAdminPassword -e REMOTECI_PLUGIN_PAIR_CODE=CiPairCode remoteci-ci
            for _ in $(seq 1 90); do
              curl -fsS http://127.0.0.1:18080/api/health >/dev/null && return 0
              sleep 1
            done
            docker logs remoteci-ci
            return 1
          }
          entry() { docker exec remoteci-ci cat /proc/1/cmdline | tr '\0' ' '; }
          start
          test "$(entry)" = "dotnet /app/RemoteCI.Server.dll "
          # 模拟一次 WebUI 自更新：把镜像中的程序（不含数据卷）装到数据卷，并标记为待验证启动。
          docker exec remoteci-ci sh -c 'mkdir /app/data/app.next \
            && tar -C /app --exclude=./data --exclude=./IMAGE_VERSION -cf - . | tar -C /app/data/app.next -xf - \
            && cp /app/IMAGE_VERSION /app/data/app.next/.base-image-version \
            && : > /app/data/app.next/.pending-start \
            && mv /app/data/app.next /app/data/app'
          # 删除并重建容器（与 fnOS 应用中心重启应用相同），数据卷中的版本必须被启用并通过启动验证。
          docker rm -f remoteci-ci
          start
          test "$(entry)" = "dotnet /app/data/app/RemoteCI.Server.dll "
          docker exec remoteci-ci test -f /app/data/app/.started
          docker rm -f remoteci-ci
          docker volume rm remoteci-ci-data

  fnos:
    name: fnos fpk 打包检查
    # ubuntu-latest 已切到 26.04，其 Docker 环境下离线镜像导入校验不通过；
    # 固定与 Release 构建一致的 24.04，适配新环境前不要改回 latest。
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7
      - name: 📦 下载 fnpack 并打包三种 fpk
        run: |
          version="0.0.0.1"
          image="ghcr.io/edge-hh/remoteci:${version}"
          mkdir -p .tools
          curl -fsSL -o .tools/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x .tools/fnpack
          python3 fnos/tests/create-fixture-image.py artifacts/fixture-amd64.tar.gz "$image" amd64
          python3 fnos/tests/create-fixture-image.py artifacts/fixture-arm64.tar.gz "$image" arm64

          REMOTECI_VERSION="$version" bash fnos/build.sh
          REMOTECI_VERSION="$version" REMOTECI_FPK_MODE=offline \
            REMOTECI_FPK_ARCH=amd64 REMOTECI_IMAGE_ARCHIVE=artifacts/fixture-amd64.tar.gz \
            bash fnos/build.sh
          REMOTECI_VERSION="$version" REMOTECI_FPK_MODE=offline \
            REMOTECI_FPK_ARCH=arm64 REMOTECI_IMAGE_ARCHIVE=artifacts/fixture-arm64.tar.gz \
            bash fnos/build.sh
          echo "version=$version" >> "$GITHUB_ENV"
      - name: 🔍 校验 fpk 结构与架构兼容
        run: |
          bash fnos/tests/test-arch-compat.sh
          bash fnos/tests/test-container-entrypoint.sh
          python3 fnos/tests/verify-package.py "artifacts/release/RemoteCI-${version}.fpk" "$version" online all
          python3 fnos/tests/verify-package.py \
            "artifacts/release/RemoteCI-${version}-fnos-x86_64-offline.fpk" "$version" offline amd64
          python3 fnos/tests/verify-package.py \
            "artifacts/release/RemoteCI-${version}-fnos-arm64-offline.fpk" "$version" offline arm64
      - name: 🐳 验证离线镜像导入流程
        run: |
          bash fnos/tests/test-offline-lifecycle.sh \
            "artifacts/release/RemoteCI-${version}.fpk" \
            "artifacts/release/RemoteCI-${version}-fnos-x86_64-offline.fpk" \
            "artifacts/release/RemoteCI-${version}-fnos-arm64-offline.fpk" \
            "$version"
