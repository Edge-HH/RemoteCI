org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 默认启用内置 Kotlin；本项目显式使用经典 KGP（Kotlin 2.4.10 + Compose/Serialization 插件版本自洽），
# 当前通过 android.newDsl=false 回退到旧 DSL 以兼容经典 KGP（AGP 9 官方过渡方案）。
# 注意：AGP 10 将移除 builtInKotlin/newDsl 开关，届时需迁移到 AGP 内置 Kotlin。
android.builtInKotlin=false
android.newDsl=false
